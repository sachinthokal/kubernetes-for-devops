<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sachin K8s Workplace UI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top left, #7c3aed, #ec4899 35%, #0ea5e9 100%);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 2rem 3rem;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(236, 72, 153, 0.4);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(124, 58, 237, 0.35);
    }
    h1 {
      margin: 0 0 1rem;
      font-size: 2rem;
      letter-spacing: 0.04em;
      color: #ede9fe;
    }
    p {
      margin: 0;
      color: #c4b5fd;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sachin K8s Workplace UI</h1>
    <p>Simple Kubernetes practice manifest workspace interface.</p>
  </div>
</body>
</html>
