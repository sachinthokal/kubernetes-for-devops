kind: Deployment
apiVersion: apps/v1
metadata:
  name: web-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
        environment: production
    spec:
      containers:
        - name: web-app
          image: nginx:latest
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
            requests:
              memory: "64Mi"
              cpu: "250m"
          volumeMounts:
            - name: html-volume-from-config
              mountPath: /usr/share/nginx/html

        - name: sidecar
          image: busybox:latest
          command: ["sh", "-c", "while true; do echo Hello from the sidecar!; sleep 10; done"]
          resources:
            limits:
              memory: "64Mi"
              cpu: "250m"
            requests:
              memory: "32Mi"
              cpu: "125m"

      volumes:
      - name: html-volume-from-config
        configMap:
          name: nginx-html-config